name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install. The suite reaches no network, needs no credentials and
      # touches no account, and it stands in for boto3 if boto3 is absent.
      - name: Compile check (the files parse, and nothing more than that)
        run: python -m py_compile src/guardian.py src/dashboard.py

      # This step is the point of the workflow. Until IA-199 to IA-206 are
      # fixed it FAILS, and that is the correct state: the repository holds
      # defects that are recorded, reproduced and not yet closed. A green
      # badge over them would be the defect this project exists to find.
      - name: Invariants
        run: python test_invariants.py

      # A suite that has only ever been seen passing is indistinguishable from
      # one that cannot fail. This breaks the code on purpose eleven ways and
      # requires the invariants that should catch each break to be the ones
      # that do. It runs after the suite, because proving a suite can fail
      # while it is already failing proves nothing.
      - name: Mutations
        run: python prove_it_can_fail.py
