name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3

      - name: Build check (compile scripts)
        run: python -m py_compile src/guardian.py src/dashboard.py

      - name: Result
        run: echo "✅ Build OK — guardian & dashboard compile cleanly."